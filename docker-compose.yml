name: agentpulse

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentpulse}
      POSTGRES_DB: ${POSTGRES_DB:-agentpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      target: runtime
      # /admin/data shows docs/SYNTHETIC_ASSUMPTIONS.md (copied into the image).
      additional_contexts:
        docs: ./docs
    # DEMO_MODE comes from .env (true for local / judge runs). Public hosting: DEMO_MODE=false,
    # which unregisters POST /api/v1/auth/demo-login.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentpulse}:${POSTGRES_PASSWORD:-agentpulse}@db:5432/${POSTGRES_DB:-agentpulse}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        # true only for the e2e build (scripts/check -E2E): adds the dev-only /dev/kit route.
        VITE_DEV_KIT: ${VITE_DEV_KIT:-false}
      labels:
        # Read by scripts/check -E2E to tell whether the running bundle has /dev/kit.
        agentpulse.devkit: ${VITE_DEV_KIT:-false}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  # --- Dev tools (scripts/check.ps1 | scripts/check.sh). Not started by `docker compose up`. ---
  # Source is mounted so checks see the working tree; dependencies come from the image.
  backend-tools:
    profiles: ["tools"]
    build:
      context: ./backend
      target: dev
    environment:
      APP_ENV: test
      RUFF_CACHE_DIR: /tmp/ruff_cache
    volumes:
      - ./backend:/app
      - ./docs:/docs:ro

  frontend-tools:
    profiles: ["tools"]
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # --- Playwright e2e (scripts/check.ps1 -E2E). Starts the stack it needs; not part of `up`. ---
  e2e:
    profiles: ["e2e"]
    build:
      context: ./e2e
    env_file:
      - path: .env
        required: false
    environment:
      E2E_BASE_URL: http://frontend
    # Specs are mounted so edits need no rebuild; dependencies come from the image.
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
    depends_on:
      - frontend
    ipc: host

volumes:
  pgdata:
