server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  # Build output ships *.gz siblings (Dockerfile); API JSON is still compressed on the fly.
  gzip_static on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Same-origin app: no framing, no MIME sniffing, no referrer leaks to other sites.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Overwrites any client value; the backend keys login lockout on it.
    proxy_set_header X-Real-IP $remote_addr;
    # SSE (copilot stream) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Hashed build assets never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    try_files $uri /index.html;
  }
}
